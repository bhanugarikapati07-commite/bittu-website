<!DOCTYPE html>
<html>
<head>
    <title>WELCOM BITTU.COM </title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f2f2f2;
            padding: 50px;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        img, video {
            margin-top: 20px;
            max-width: 80%;
            max-height: 400px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>Welcome to BITTU.COM</h1>
    <P>PHOTO & VIDEO UPLOAD</P>

    <!-- Image Button -->
    <input type="file" id="imageInput" accept="image/*" hidden>
    <button onclick="document.getElementById('imageInput').click()">
        📷 Add Photo
    </button>

    <!-- Video Button -->
    <input type="file" id="videoInput" accept="video/*" hidden>
    <button onclick="document.getElementById('videoInput').click()">
        🎥 Add Video
    </button>

    <input type="file" id="DInput" accept="application/pdf" hidden>
    <button onclick="document.getElementById('DInput').click()">
        📄 Add Document
    </button>

    <br>

    <img id="imagePreview" style="display:none;">

    <video id="videoPreview" controls style="display:none;"></video>

    <script>
        // Image preview
        document.getElementById("imageInput").onchange = function(event) {
            const file = event.target.files[0];

            if (file) {
                const image = document.getElementById("imagePreview");

                image.src = URL.createObjectURL(file);
                image.style.display = "block";

                document.getElementById("videoPreview").style.display = "none";
            }
        };

        // Video preview
        document.getElementById("videoInput").onchange = function(event) {
            const file = event.target.files[0];

            if (file) {
                const video = document.getElementById("videoPreview");

                video.src = URL.createObjectURL(file);
                video.style.display = "block";

                document.getElementById("imagePreview").style.display = "none";
            }
        };
    </script>


<html lang="gh">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BITTU.COM</title>
</head>
<body>

    <p>CHECK  YOUR MESSAGE</p>

    <button onclick="alert('Hello dear friend!')">
        Tap here to see a message
    </button>

</body>
</html>
